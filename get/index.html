<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Get swithAI</title>
<!--
  One link that serves both stores.

  Exists because TikTok's profile Links field and X's Website field
  each take a single URL, and every URL in an X post costs 23
  characters whatever its length. Point those at getswith.com/get.

  iPhone and iPad go to the App Store, Android to Google Play, and
  anything else sees both buttons.
-->
<style>
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #08090c; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .tag {
    font-size: 0.78rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: #D6B36A; font-weight: 600; margin: 0;
  }
  h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 10px; }
  a {
    display: flex; flex-direction: column; justify-content: center;
    min-width: 210px; padding: 10px 22px;
    background: #14161b; border: 1px solid rgba(255,255,255,0.09);
    border-radius: 10px; text-decoration: none; color: #fff;
  }
  a:hover { border-color: rgba(255,255,255,0.28); background: #1a1d23; }
  a i {
    font-style: normal; font-size: 0.68rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(255,255,255,0.40);
  }
  a b { font-size: 1.05rem; font-weight: 600; }
  .home { margin-top: 10px; font-size: 0.85rem; }
  .home a {
    all: unset; color: #60a5fa; cursor: pointer;
  }
</style>
</head>
<body>

<p class="tag">Move &middot; Fuel &middot; Rest</p>
<h1>swithAI</h1>

<a href="https://apps.apple.com/us/app/swithai/id6783848103">
  <i>Download on the</i><b>App Store</b>
</a>
<a href="https://play.google.com/store/apps/details?id=com.wellnesschampion.app">
  <i>Get it on</i><b>Google Play</b>
</a>

<p class="home"><a href="/">About swithAI</a></p>

<script>
(function () {
  var APPLE = 'https://apps.apple.com/us/app/swithai/id6783848103';
  var PLAY  = 'https://play.google.com/store/apps/details?id=com.wellnesschampion.app';

  var ua = navigator.userAgent || '';

  // iPadOS 13 and later report a Macintosh user agent, so a Mac
  // reporting touch points is an iPad. A real Mac reports 0.
  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
              (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

  var isAndroid = /Android/.test(ua);

  // replace() rather than assigning href: with href, a visitor who
  // hits back is sent through this redirect again and cannot leave.
  if (isIOS)          window.location.replace(APPLE);
  else if (isAndroid) window.location.replace(PLAY);
  // Desktop and anything unrecognised falls through to both buttons.
})();
</script>

</body>
</html>
